[package]
name = "kcl-embed"
version.workspace = true
edition.workspace = true
description = "In-process Rust embedding API for KCL"

# Strict lints per the fork's scm-infra style conventions (see plan
# section "Style conventions for new crates"). Pre-existing crates are
# left alone; new code in this crate does not regress that posture.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
todo = "deny"

[dependencies]
anyhow = "1"
thiserror = "2"
tracing.workspace = true
kcl-ast.workspace = true
kcl-error.workspace = true
kcl-evaluator.workspace = true
kcl-parser.workspace = true
kcl-runner.workspace = true
kcl-runtime.workspace = true
kcl-sema.workspace = true
# F2.7a: kcl_embed::resolve's EagerValue carries typed inet values;
# pin to the same workspace-level version as kcl-runtime / Tilley
# so the cidr crate's IpCidr / IpInet types are identity-matched
# across the public API surface.
cidr = "0.3"

[dev-dependencies]
tracing-subscriber.workspace = true
# F1.6 integration tests: exercise the as_cidr / as_inet / as_macaddr
# / as_macaddr8 / as_ip_family ValueRef accessors against typed
# values directly (the path the codegen-emitted TryFrom bodies
# follow).
macaddr = "1.0"
